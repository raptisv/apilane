<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Apilane Portal: manage your Apilane applications, entities, security rules and servers." />
    <meta name="theme-color" content="#09090b" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Apilane</title>
    <style>
      /* Only what the start-up loader below needs before the stylesheet arrives. */
      html { background: #09090b; color: #a1a1aa; }
      body { margin: 0; }
      #app > .boot {
        --boot-brand: #209cee;
        --boot-strong: #60b8f5;
        --boot-track: #1b2a3a;
        --boot-ink: #fafafa;
        align-items: center;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        justify-content: center;
        min-height: 100vh;
        min-height: 100dvh;
        padding: 1.5rem;
        /* A load that takes a moment shows the loader; a fast one never flashes it. */
        animation: boot-in 0.3s ease-out 0.15s both;
      }
      .boot-mark { height: 80px; position: relative; width: 80px; }
      .boot-mark::before {
        animation: boot-glow 2.4s ease-in-out infinite;
        background: radial-gradient(closest-side, var(--boot-brand), transparent);
        border-radius: 50%;
        content: "";
        inset: -26px;
        opacity: 0.22;
        position: absolute;
      }
      .boot-mark svg { animation: boot-float 2.6s ease-in-out infinite; display: block; height: 100%; position: relative; width: 100%; }
      .boot-shine { animation: boot-shine 2.2s ease-in-out infinite; }
      .boot-name { color: var(--boot-ink); font-size: 22px; font-weight: 700; letter-spacing: -0.2px; margin-top: 20px; }
      .boot-bar { background: var(--boot-track); border-radius: 999px; height: 3px; margin-top: 18px; overflow: hidden; width: 140px; }
      .boot-bar > span {
        animation: boot-bar 1.3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        background: linear-gradient(90deg, var(--boot-brand), var(--boot-strong));
        border-radius: 999px;
        display: block;
        height: 100%;
        width: 45%;
      }
      .boot-text { margin: 12px 0 0; }
      @keyframes boot-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @keyframes boot-glow { 50% { opacity: 0.4; transform: scale(1.1); } }
      @keyframes boot-float { 50% { transform: translateY(-4px) scale(1.03); } }
      @keyframes boot-shine { from { transform: translateX(-220px) skewX(-20deg); } to { transform: translateX(640px) skewX(-20deg); } }
      @keyframes boot-bar { from { transform: translateX(-110%); } to { transform: translateX(240%); } }
      @media (prefers-reduced-motion: reduce) {
        #app > .boot, .boot-mark::before, .boot-mark svg, .boot-shine, .boot-bar > span { animation: none; }
        .boot-shine { opacity: 0; }
        .boot-bar > span { width: 100%; }
      }
    </style>
  </head>
  <body>
    <!--
      Shown until the session has loaded; the app (or the start-up error) replaces it. Self-contained
      (no script, no font, no image request).
    -->
    <div id="app">
      <div class="boot" role="status" aria-live="polite">
        <div class="boot-mark" aria-hidden="true">
          <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <clipPath id="boot-tile"><rect width="512" height="512" rx="112" /></clipPath>
              <linearGradient id="boot-sheen" x1="0" x2="1" y1="0" y2="0">
                <stop offset="0" stop-color="#fff" stop-opacity="0" />
                <stop offset="0.5" stop-color="#fff" stop-opacity="0.45" />
                <stop offset="1" stop-color="#fff" stop-opacity="0" />
              </linearGradient>
            </defs>
            <rect width="512" height="512" rx="112" fill="#209cee" />
            <path
              fill="#fff"
              fill-rule="evenodd"
              stroke="#fff"
              stroke-width="12"
              stroke-linejoin="round"
              d="M 222.0 106.0 L 290.0 106.0 L 404.0 406.0 L 336.0 406.0 L 318.0 360.0 L 194.0 360.0 L 176.0 406.0 L 108.0 406.0 Z M 256.0 196.8 L 220.6 290.0 L 291.4 290.0 Z"
            />
            <g clip-path="url(#boot-tile)">
              <rect class="boot-shine" x="0" y="-20" width="160" height="552" fill="url(#boot-sheen)" />
            </g>
          </svg>
        </div>
        <div class="boot-name" aria-hidden="true">Apilane</div>
        <div class="boot-bar" aria-hidden="true"><span></span></div>
        <p class="boot-text">Loading…</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
